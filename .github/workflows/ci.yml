name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Disposable database so the integration suites (task domain, migrations,
    # seed) run inside the required check instead of skipping.
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: agent_trail
          POSTGRES_PASSWORD: agent_trail
          POSTGRES_DB: agent_trail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_trail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agent_trail:agent_trail@localhost:5432/agent_trail?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Deterministic pre-merge gate: format, lint, test, build for every Go
      # module and Node app, plus the docs ASCII check (keep the job name
      # `test` - branch protection requires this check). AI gates (review,
      # docs-sync) run pre-merge on the agent side; see
      # docs/operations/validation-pipeline.md.
      - name: Gate
        run: bash scripts/gate.sh
