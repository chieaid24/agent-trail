name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: agent_trail
          POSTGRES_PASSWORD: agent_trail
          POSTGRES_DB: agent_trail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_trail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agent_trail:agent_trail@localhost:5432/agent_trail?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # tf never applied from ci; gate validates offline with -backend=false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
      - name: Cache terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('deploy/terraform/envs/*/.terraform.lock.hcl') }}
      - name: Terraform plugin cache dir
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      # job must stay named test: branch protection requires this check
      - name: Gate
        run: bash scripts/gate.sh
      - name: Verify dashboard image
        run: bash scripts/verify-web-image.sh
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify Kubernetes runner
        run: bash scripts/verify-k8s-runner.sh
