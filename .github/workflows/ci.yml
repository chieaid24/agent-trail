name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deterministic pre-merge gate: format, lint, test, docs ASCII. Auto-detects
      # stack and skips absent tooling, so gates fill in as the Go/Next.js monorepo
      # lands (keep the job name `test` - branch protection requires this check).
      # AI gates (review, docs-sync) run pre-merge on the agent side; see
      # docs/operations/validation-pipeline.md.
      - name: Gate
        run: bash scripts/gate.sh
