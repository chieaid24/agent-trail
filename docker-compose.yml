name: agent-trail

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: agent_trail
      POSTGRES_PASSWORD: agent_trail
      POSTGRES_DB: agent_trail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_trail"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm:0.30.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - otel-lgtm-data:/data

volumes:
  postgres-data:
  otel-lgtm-data:
