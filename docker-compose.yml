name: agent-trail

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: agent_trail
      POSTGRES_PASSWORD: agent_trail
      POSTGRES_DB: agent_trail
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_trail"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/dev/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"

volumes:
  postgres-data:
