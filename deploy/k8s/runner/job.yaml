# Hardened one-shot runner Job (docs/operations/aws-deployment.md). The
# worker claims one task attempt from the queue, executes it with the
# configured agent, publishes, and exits; ttlSecondsAfterFinished then
# reclaims the Job and its pod. envsubst variables: JOB_NAME,
# TASK_ATTEMPT_ID (label only in the pull model), RUNNER_IMAGE,
# TTL_SECONDS, ACTIVE_DEADLINE_SECONDS, GITHUB_API_BASE_URL,
# WORKER_IDLE_EXIT_SECONDS, AGENT_PROVIDER.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: agent-trail-runners
  labels:
    app.kubernetes.io/name: agent-trail-runner
    agent-trail.dev/task-attempt-id: "${TASK_ATTEMPT_ID}"
spec:
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  backoffLimit: 0
  activeDeadlineSeconds: ${ACTIVE_DEADLINE_SECONDS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-trail-runner
    spec:
      restartPolicy: Never
      serviceAccountName: runner-task
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group-owns the secret volume so the 0440 key is readable.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ${RUNNER_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runner-database
                  key: url
            - name: RUNNER_TYPE
              value: kubernetes
            - name: WORKER_MAX_TASKS
              value: "1"
            - name: WORKER_IDLE_EXIT_SECONDS
              value: "${WORKER_IDLE_EXIT_SECONDS}"
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: AGENT_PROVIDER
              value: ${AGENT_PROVIDER}
            - name: GITHUB_API_BASE_URL
              value: ${GITHUB_API_BASE_URL}
            - name: GITHUB_APP_ID
              value: "1"
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/agent-trail/github/key.pem
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-github
                  key: webhook-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: github-key
              mountPath: /etc/agent-trail/github
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: github-key
          secret:
            secretName: runner-github
            items:
              - key: key.pem
                path: key.pem
            defaultMode: 0440
