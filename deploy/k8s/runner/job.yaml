# render vars: JOB_NAME TASK_ATTEMPT_ID RUNNER_IMAGE TTL_SECONDS ACTIVE_DEADLINE_SECONDS GITHUB_API_BASE_URL WORKER_IDLE_EXIT_SECONDS AGENT_PROVIDER AGENT_CLI_PATH AGENT_MODEL AGENT_PERMISSION_MODE AGENT_CLI_VERSION OTEL_EXPORTER_OTLP_ENDPOINT CONFLICT_LLM_ENABLED CONFLICT_LLM_PROVIDER CONFLICT_LLM_MODEL
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: agent-trail-runners
  labels:
    app.kubernetes.io/name: agent-trail-runner
    app.kubernetes.io/managed-by: agent-trail-controller
    agent-trail.dev/task-attempt-id: ${TASK_ATTEMPT_ID}
spec:
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  backoffLimit: 0
  activeDeadlineSeconds: ${ACTIVE_DEADLINE_SECONDS}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-trail-runner
        app.kubernetes.io/managed-by: agent-trail-controller
        agent-trail.dev/task-attempt-id: ${TASK_ATTEMPT_ID}
    spec:
      restartPolicy: Never
      serviceAccountName: runner-task
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # group-owns the secret volume so the 0440 key is readable
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ${RUNNER_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: runner-database
                  key: url
            - name: RUNNER_TYPE
              value: kubernetes
            - name: TASK_ATTEMPT_ID
              value: ${TASK_ATTEMPT_ID}
            - name: WORKER_MAX_TASKS
              value: "1"
            - name: WORKER_IDLE_EXIT_SECONDS
              value: ${WORKER_IDLE_EXIT_SECONDS}
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: AGENT_PROVIDER
              value: ${AGENT_PROVIDER}
            - name: AGENT_CLI_PATH
              value: ${AGENT_CLI_PATH}
            - name: AGENT_MODEL
              value: ${AGENT_MODEL}
            - name: AGENT_PERMISSION_MODE
              value: ${AGENT_PERMISSION_MODE}
            - name: AGENT_CLI_VERSION
              value: ${AGENT_CLI_VERSION}
            - name: CONFLICT_LLM_ENABLED
              value: ${CONFLICT_LLM_ENABLED}
            - name: CONFLICT_LLM_PROVIDER
              value: ${CONFLICT_LLM_PROVIDER}
            - name: CONFLICT_LLM_MODEL
              value: ${CONFLICT_LLM_MODEL}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: GITHUB_API_BASE_URL
              value: ${GITHUB_API_BASE_URL}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: runner-github
                  key: app-id
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/agent-trail/github/key.pem
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: runner-github
                  key: webhook-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runner-agent
                  key: anthropic-api-key
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-agent
                  key: claude-code-oauth-token
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: github-key
              mountPath: /etc/agent-trail/github
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: github-key
          secret:
            secretName: runner-github
            items:
              - key: key.pem
                path: key.pem
            defaultMode: 0440
