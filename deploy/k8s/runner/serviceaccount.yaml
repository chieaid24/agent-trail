# runner-task: identity of one task Job. No Kubernetes API access - the
# token is never mounted (also forced off per-pod in job.yaml). In AWS the
# runner_cluster Terraform module binds this name to a narrow IAM role via
# IRSA (artifact upload only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-task
  namespace: agent-trail-runners
  labels:
    app.kubernetes.io/name: agent-trail-runner
automountServiceAccountToken: false
---
# runner-controller: the component that creates and reaps task Jobs. Only
# it may touch the Kubernetes API, and only for Jobs in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-controller
  namespace: agent-trail-runners
  labels:
    app.kubernetes.io/name: agent-trail-runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-controller
  namespace: agent-trail-runners
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-controller
  namespace: agent-trail-runners
subjects:
  - kind: ServiceAccount
    name: runner-controller
    namespace: agent-trail-runners
roleRef:
  kind: Role
  name: runner-controller
  apiGroup: rbac.authorization.k8s.io
