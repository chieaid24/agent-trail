# Default posture for runner pods: no ingress, no egress. Every allowed
# path is an explicit exception below or in an environment overlay.
# deploy/k8s/local/networkpolicy.yaml allows the local verification stack;
# each cloud environment must allow its database, artifact store, and git remotes.
# Render KUBERNETES_API_CIDR as the API Service IP with a /32 mask.
# Enforcement depends on the cluster's CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-trail-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: agent-trail-runners
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runner-controller-kubernetes-api
  namespace: agent-trail-runners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-trail-runner-controller
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${KUBERNETES_API_CIDR}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
