# render KUBERNETES_API_CIDR as the api service ip with a /32 mask; enforcement needs cni support
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-trail-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: agent-trail-runners
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runner-controller-kubernetes-api
  namespace: agent-trail-runners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-trail-runner-controller
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${KUBERNETES_API_CIDR}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
