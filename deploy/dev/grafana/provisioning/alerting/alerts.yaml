# Dev Grafana alert rules: the nine alerts from
# docs/operations/observability.md, evaluated against the provisioned
# Prometheus datasource (uid: prometheus). Thresholds are dev defaults, not
# measured SLOs; tune per environment.
apiVersion: 1

groups:
  - orgId: 1
    name: agent-trail
    folder: Agent Trail
    interval: 1m
    rules:
      - uid: at-alert-webhook-errors
        title: High webhook error rate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 10% of webhook deliveries failed signature validation over 10m.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(rate(agent_trail_webhook_invalid_signature_total[10m])) / clamp_min(sum(rate(agent_trail_webhook_received_total[10m])), 1e-9)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0.1], type: gt }

      - uid: at-alert-queue-wait
        title: Long queue wait
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: p95 task queue wait exceeded 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: histogram_quantile(0.95, sum by (le) (rate(agent_trail_task_queue_wait_seconds_bucket[10m])))
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [300], type: gt }

      - uid: at-alert-no-runners
        title: No healthy runners
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: No runner is reporting resource metrics; the worker fleet is down.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: count(agent_trail_runner_cpu_usage) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [1], type: lt }

      - uid: at-alert-missed-heartbeats
        title: Missed heartbeats
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A runner was marked lost after missing its heartbeat window.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(increase(agent_trail_runner_heartbeats_missed_total[10m])) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }

      - uid: at-alert-task-failures
        title: Elevated task failure rate
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Tasks are failing at more than roughly one per minute over 15m.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(rate(agent_trail_task_failures_total[15m])) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0.016], type: gt }

      - uid: at-alert-db-saturation
        title: Database saturation
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: PostgreSQL is using more than 80% of max_connections.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(pg_stat_activity_count) / scalar(pg_settings_max_connections)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0.8], type: gt }

      - uid: at-alert-object-storage
        title: Object storage errors
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: MinIO is returning S3 request errors.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(rate(minio_s3_requests_errors_total[10m])) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }

      - uid: at-alert-cleanup-backlog
        title: Cleanup backlog
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Workspace cleanups are failing; worktrees are accumulating on runner hosts.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(increase(agent_trail_workspace_cleanup_total{outcome="failed"}[15m])) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }

      - uid: at-alert-policy-denials
        title: Unusual policy denials
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The push policy refused an operation; something attempted a forbidden push.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: sum(increase(agent_trail_policy_denials_total[15m])) or on() vector(0)
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
