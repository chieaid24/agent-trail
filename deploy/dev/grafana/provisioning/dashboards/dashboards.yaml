# Dev Grafana: load the committed Agent Trail dashboards from this directory.
apiVersion: 1

providers:
  - name: agent-trail
    orgId: 1
    folder: Agent Trail
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
